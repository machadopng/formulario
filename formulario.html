<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0,
            maximum-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/froala_editor.pkgd.min.css" rel="stylesheet"
        type="text/css" />
</head>

<body>
    <div class="header">
                <img src="minecraft-logo.png" alt="Logo" class="logo">
        </div>
    <form action="/submit" method="POST">
        

        <h3>Cadastre-se </h3>


        <div class="form-group">
            <label for="nome">Nome: </label>
            <input type="text" id="nome" name="nome" placeholder="nome completo…">
        </div>


        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento: </label>
            <input type="date" id="data_nascimento" name="data_nascimento">
        </div>


        <div class="form-group">
            <label for="genero">Gênero: </label>
            <input type="radio" id="genero" name="genero" value="masculino">
            <label for="genero">Masculino</label>
            <input type="radio" id="genero" name="genero" value="feminino">
            <label for="genero">Feminino</label>
            <input type="radio" id="genero" name="genero" value="outro">
            <label for="genero">Outro</label>
        </div>


        <div class="form-group">
            <label for="email">Email: </label>
            <input type="email" id="email" name="email">
        </div>


        <div class="form-group">
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999"
                pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required>
        </div>


        <div class="form-group">
            <label for="senha">Senha: </label>
            <input type="password" id="senha" name="senha">
        </div>


        <div class="form-group">
            <label for="CPF:">CPF: </label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                title="Digite o CPF no formato 000.000.000-00" required>
        </div>


        <div class="form-group">
            <label>Habilidades: </label>
            <label for="html">
                <input type="checkbox" id="html" name="habilidades" value="HTML">HTML
            </label>
            <label for="css">
                <input type="checkbox" id="css" name="habilidades" value="CSS">CSS
            </label>
            <label for="js">
                <input type="checkbox" id="js" name="habilidades" value="JS">JavaScript
            </label>
        </div>


        <div class="form-group">
            <label for="pais">País: </label>

            <select id="pais" name="pais">
                <option value="br">Brasil </option>
                <option value="us">Estados Unidos </option>
                <option value="uk">Reino Unido </option>
                <option value="fr">França </option>
                <option value="de">Alemanha </option>
            </select>
        </div>


        <div class="form-group" id="text">
            <label for="comentarios">Comentários: </label><br>
            <div id="froala-editor"> </div>
            <script type="text/javascript"
                src="https://cdn.jsdelivr.net/npm/froala-editor@latest/js/froala_editor.pkgd.min.js"></script>
            <script>
                new FroalaEditor("div#froala-editor");
            </script>
        </div>


        <div class="form-group">
            <button type="submit">Enviar</button>
        </div>

        
    


    </form>

</body>

</html>
